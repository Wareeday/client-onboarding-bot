name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[yaml,dev]"

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Type-check with mypy
        run: mypy src

      - name: Run pytest suite
        run: pytest -v

      - name: Run unittest discovery
        run: python -m unittest discover -s tests -v

      - name: Smoke test CLI commands
        run: |
          python main.py validate --input sample_data/clients_sample.csv
          python main.py --dry-run --input sample_data/clients_sample.csv
          python main.py --input sample_data/clients_enterprise.json --output-dir /tmp/ci-out
          python main.py status --output-dir /tmp/ci-out
          python main.py report --output-dir /tmp/ci-out
